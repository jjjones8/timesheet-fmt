[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet-fmt"
version = "0.1.0"
description = "Normalize messy time-sheet entries into a consistent HH:MM-HH:MM format"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jjjones8" }]

[project.scripts]
timesheet-fmt = "timesheet_fmt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
